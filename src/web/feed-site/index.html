<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var c = localStorage.getItem("color-scheme");
        if (c === "light" || c === "dark") {
          document.querySelector('meta[name="color-scheme"]').content = c;
        }
      } catch (e) {}
    </script>
    <title>feed.e9.cx — Feeds &amp; Daily Archive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Inline config so auth works even if /config.js 404s (CloudFront SPA fallback). Deploy replaces placeholders. -->
    <script>
      window.API_BASE_URL = "API_URL_PLACEHOLDER";
      window.COGNITO_USER_POOL_ID = "POOL_ID_PLACEHOLDER";
      window.COGNITO_CLIENT_ID = "CLIENT_ID_PLACEHOLDER";
    </script>
    <script src="/amazon-cognito-identity.min.js"></script>
    <script src="/config.js"></script>
    <script src="/auth.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
